app = "graphcore-world-generation"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  GRAPHCORE_WORKER_POLL_INTERVAL_MS = "2500"
  OUTPUT_WORKFLOW_WORKER_CONCURRENCY = "3"
  OPENAI_REQUEST_TIMEOUT_MS = "900000"
  WORLD_PROMPT_FLY_STREAM_TIMEOUT_MS = "900000"
  WORLD_PROMPT_GENERATION_RUNTIME = "fly"

[processes]
  app = "deno run --allow-env --allow-net --allow-read --allow-write --allow-run --allow-ffi --allow-sys --node-modules-dir=auto workers/world-generation/main.ts"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
