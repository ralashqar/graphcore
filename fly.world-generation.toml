app = "graphcore-world-generation"
primary_region = "lhr"
# Give in-flight LLM node executions time to finish or hand over cleanly on
# deploys/restarts; the shutdown handler also requeues claimed runs immediately.
kill_timeout = 300

[build]
  dockerfile = "workers/world-generation/Dockerfile"

[env]
  GRAPHCORE_WORKER_POLL_INTERVAL_MS = "10000"
  OUTPUT_WORKFLOW_WORKER_CONCURRENCY = "3"
  OPENAI_REQUEST_TIMEOUT_MS = "900000"
  WORLD_PROMPT_FLY_STREAM_TIMEOUT_MS = "900000"
  WORLD_PROMPT_GENERATION_RUNTIME = "fly"

[processes]
  app = "deno run --allow-env --allow-net --allow-read --allow-write --allow-ffi --allow-sys --allow-run --node-modules-dir=auto workers/world-generation/main.ts"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
